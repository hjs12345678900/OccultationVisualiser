name: Build standalone desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tag release is ready before packaging
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "Verified desktop packages are being prepared."
          fi
  package:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            name: Windows-x64
          - os: macos-15-intel
            architecture: x64
            name: macOS-Intel
          - os: macos-15
            architecture: arm64
            name: macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -e ".[build]"
      - run: python build_tools/build.py
        env:
          PYTHONUTF8: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: OccultationVisualiser-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/package-self-test.json
      - name: Upload verified desktop packages to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ matrix.name }}
        run: |
          cp dist/package-self-test.json "dist/package-self-test-${PACKAGE_NAME}.json"
          gh release upload "$GITHUB_REF_NAME" dist/*.zip "dist/package-self-test-${PACKAGE_NAME}.json"
